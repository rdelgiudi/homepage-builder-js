# Two containers from the same image, behind ONE hostname:
#
#   homepage        the public site. APP_ROLE=public means the admin panel does not
#                   exist in this container at all (/admin and /api/admin answer 404),
#                   and config/content are mounted read-only.
#
#   homepage-admin  the admin panel. It writes homepage.json, the markdown files and
#                   the database; the public container picks the changes up by itself.
#
# Reverse proxy rule: send exactly two path prefixes to homepage-admin and everything
# else to homepage:
#
#       /admin        (the panel, the sign-in page and the draft preview)
#       /api/admin    (everything the panel calls)
#
# The admin session cookie is scoped to those two prefixes, so the browser never sends
# it to the public container. The preview's widgets, the WebSocket and all assets are
# served by the public container, which is why only it needs the integration keys.
#
# Always rebuild / recreate BOTH containers together: the admin pages load their
# scripts (/_next/...) from the public container, so the two must run the same build.
#
# Traefik labels for this are sketched below (commented out). To keep the sign-in page
# off the internet, add an IP allow-list or VPN-only entrypoint to the admin router.
#
# Variations:
#   * No proxy path rule: publish the admin container on its own port instead
#     (ports: ["127.0.0.1:3001:3000"]) and open http://localhost:3001/admin. Give it
#     the integration keys too if you want live widget data in the preview.
#   * One container: delete homepage-admin, remove APP_ROLE and the two ":ro" flags
#     from homepage, and set ADMIN_PASSWORD_HASH there.

services:
  homepage:
    build: .
    container_name: next-js-homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - homepage_data:/app/data
      - ./src/config:/app/src/config:ro
      - ./src/content:/app/src/content:ro
    environment:
      - HOST=0.0.0.0
      - APP_ROLE=public
      - DISCORD_SERVER_ID=${DISCORD_SERVER_ID:-}
      - DISCORD_USER_ID=${DISCORD_USER_ID:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAM_ID=${STEAM_ID:-}
      - OVERWATCH_BATTLE_TAG=${OVERWATCH_BATTLE_TAG:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      # Optional ntfy notifications for new messages, comments and game suggestions (sent from this container).
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_CLICK=${NTFY_CLICK:-}
      - NTFY_EVENTS=${NTFY_EVENTS:-}
      - VISITOR_SALT=${VISITOR_SALT:-}
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.homepage.rule=Host(`example.com`)
    #   - traefik.http.services.homepage.loadbalancer.server.port=3000

  homepage-admin:
    build: .
    container_name: next-js-homepage-admin
    restart: unless-stopped
    volumes:
      - homepage_data:/app/data
      - ./src/config:/app/src/config
      - ./src/content:/app/src/content
    environment:
      - HOST=0.0.0.0
      # Generate with: docker compose run --rm homepage-admin node scripts/admin-hash.js
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      # Must be the same in both containers so visitor ids hash the same way.
      - VISITOR_SALT=${VISITOR_SALT:-}
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.homepage-admin.rule=Host(`example.com`) && (PathPrefix(`/admin`) || PathPrefix(`/api/admin`))
    #   - traefik.http.services.homepage-admin.loadbalancer.server.port=3000

volumes:
  homepage_data:
