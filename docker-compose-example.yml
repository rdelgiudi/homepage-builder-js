# Two containers from the same image:
#
#   homepage        the public site. Route your reverse proxy to this one.
#                   APP_ROLE=public means the admin panel does not exist here at all
#                   (/admin and /api/admin answer 404), and config/content are read-only.
#
#   homepage-admin  the admin panel (http://localhost:3001/admin). Do NOT route it
#                   through the public proxy — keep it on localhost / your LAN / a VPN.
#                   It writes homepage.json, the markdown files and the database; the
#                   public container picks the changes up by itself.
#
# Both get the same integration keys, so the admin panel's preview shows live Discord /
# Steam / Overwatch data just like the real site. The admin container only queries those
# services while the panel is open in a browser (it pauses with no viewers, like the
# public one), and the Discord bot being logged in from two containers is fine.
#
# Simpler alternative: delete the homepage-admin service, remove APP_ROLE and the two
# ":ro" flags from homepage, and set ADMIN_PASSWORD_HASH there. The panel is then served
# at /admin on the public site, protected by the password only.

x-shared-env: &shared-env
  HOST: 0.0.0.0
  DISCORD_SERVER_ID: ${DISCORD_SERVER_ID:-}
  DISCORD_USER_ID: ${DISCORD_USER_ID:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  STEAM_API_KEY: ${STEAM_API_KEY:-}
  STEAM_ID: ${STEAM_ID:-}
  OVERWATCH_BATTLE_TAG: ${OVERWATCH_BATTLE_TAG:-}
  # Must be the same in both containers so visitor ids hash the same way.
  VISITOR_SALT: ${VISITOR_SALT:-}

services:
  homepage:
    build: .
    container_name: next-js-homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - homepage_data:/app/data
      - ./src/config:/app/src/config:ro
      - ./src/content:/app/src/content:ro
    environment:
      <<: *shared-env
      APP_ROLE: public

  homepage-admin:
    build: .
    container_name: next-js-homepage-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - homepage_data:/app/data
      - ./src/config:/app/src/config
      - ./src/content:/app/src/content
    environment:
      <<: *shared-env
      # Generate with: docker compose run --rm homepage-admin node scripts/admin-hash.js
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}

volumes:
  homepage_data:
